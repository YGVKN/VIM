local 185.X.X.X
port 1111
proto udp
dev tun
ca ca.crt
cert server.crt
key server.key
dh dh.pem
auth SHA512
tls-crypt tc.key
topology subnet
server 10.8.0.0 255.255.255.0
push "redirect-gateway def1 bypass-dhcp"
ifconfig-pool-persist ipp.txt
push "dhcp-option DNS 127.0.0.1"
push "dhcp-option DNS 8.8.8.8"
push "dhcp-option DNS 8.8.4.4"
push "dhcp-option DNS 209.222.18.222"
push "dhcp-option DNS 209.222.18.218"
push "block-outside-dns"
#txqueuelen 3000
keepalive 10 120
user nobody
group nogroup
persist-key
persist-tun
verb 4
#log /dev/null
#status /dev/null
crl-verify crl.pem
explicit-exit-notify
duplicate-cn

fast-io
sndbuf 0
rcvbuf 0
push "sndbuf 0"
push "rcvbuf 0"
tun-mtu 1500
mssfix 1400

cipher AES-128-GCM #Same for the client
data-ciphers AES-128-GCM:AES-256-GCM:AES-256-CBC
